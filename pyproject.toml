[project]
name = "monitordecorrelation"
version = "0.1.0"
description = "Studying detector co-degradation under RL training pressure"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "tinker>=0.29.1",
    "numpy>=2.0",
    "python-dotenv>=1.0",
    "jinja2>=3.1.6",
    "wandb>=0.27.1",
    "matplotlib>=3.10.9",
    "tinker-cookbook>=0.5.7",
    "scikit-learn>=1.9.0",
    "peft>=0.19.1",
    "tml-renderers>=0.1.0",
    "reasoning-gym>=0.1.25",
    # Inkling (`inkling_mm_model`) needs >=5.14; see [tool.uv].override-dependencies —
    # tinker-cookbook still declares transformers<=5.5.4.
    "transformers>=5.14.0",
    # Inkling's AutoProcessor pulls InklingImageProcessor (torchvision backend) even for text-only.
    "torchvision>=0.20",
]

# GPU-only acceleration kernels for the white-box forward passes (Qwen3.5 is a hybrid
# linear-attention arch). CUDA-only — the `sys_platform == 'linux'` markers keep them off macOS so
# `uv sync` never tries to build them locally. On a rented CUDA box: `uv sync --extra gpu`.
# (pyproject has no "CUDA available" marker; linux is the practical proxy.)
[project.optional-dependencies]
gpu = [
    "flash-attn>=2.5; sys_platform == 'linux'",
    "flash-linear-attention; sys_platform == 'linux'",
    "causal-conv1d; sys_platform == 'linux'",
]

# tinker-cookbook 0.5.7 pins transformers<=5.5.4, which predates Inkling day-0 support (5.14).
# Override so the whitebox path can load `inkling_mm_model` without waiting on a cookbook bump.
[tool.uv]
override-dependencies = [
    "transformers>=5.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monitordecorrelation"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
