[project]
name = "monitordecorrelation"
version = "0.1.0"
description = "Studying detector co-degradation under RL training pressure"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "tinker>=0.22.3",
    "numpy>=2.0",
    "python-dotenv>=1.0",
    "jinja2>=3.1.6",
    "wandb>=0.27.1",
    "matplotlib>=3.10.9",
    "tinker-cookbook>=0.4.1",
    "scikit-learn>=1.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monitordecorrelation"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
