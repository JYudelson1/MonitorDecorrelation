[project]
name = "monitordecorrelation"
version = "0.1.0"
description = "Studying detector co-degradation under RL training pressure"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "tinker>=0.24",
    "numpy>=2.0",
    "python-dotenv>=1.0",
    "jinja2>=3.1.6",
    "wandb>=0.27.1",
    "matplotlib>=3.10.9",
    "tinker-cookbook>=0.4.1",
    "scikit-learn>=1.9.0",
    "peft>=0.19.1",
    "tml-renderers>=0.1.0",
]

# GPU-only acceleration kernels for the white-box forward passes (Qwen3.5 is a hybrid
# linear-attention arch). CUDA-only — the `sys_platform == 'linux'` markers keep them off macOS so
# `uv sync` never tries to build them locally. On a rented CUDA box: `uv sync --extra gpu`.
# (pyproject has no "CUDA available" marker; linux is the practical proxy.)
[project.optional-dependencies]
gpu = [
    "flash-attn>=2.5; sys_platform == 'linux'",
    "flash-linear-attention; sys_platform == 'linux'",
    "causal-conv1d; sys_platform == 'linux'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monitordecorrelation"]

[dependency-groups]
dev = [
    "omegaconf>=2.3.1",
    "pytest>=9.0.3",
]
